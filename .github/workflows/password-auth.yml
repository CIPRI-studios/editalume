name: Editalume · password auth QA
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check site/account.js && node --check site/sw.js && node tests/password-flow.cjs
