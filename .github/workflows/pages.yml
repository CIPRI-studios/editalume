name: Editalume · independent GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
      - 'radar/build_snapshots.py'
      - 'radar/test_build_snapshots.py'
  workflow_dispatch:
  schedule:
    - cron: '30 */4 * * *' # independent 4-hour public snapshot refresh
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: editalume-site-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout standalone site
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify independently built snapshot format
        run: |
          python -m unittest radar.test_build_snapshots -v
          python radar/build_snapshots.py --offline-check
      - name: Build static fallback from Editalume's own public Supabase data
        run: |
          set -euo pipefail
          python radar/build_snapshots.py --out site
          for name in opportunities.json search-index.json refresh-status.json; do
            python -m json.tool "site/$name" >/dev/null
          done
      - name: Verify required independent files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html conta.html avaliar.html privacidade.html manifest.webmanifest sw.js icon.svg account.js national.js app.js company-fit-core.js company-fit.js company-fit.css; do
            test -s "site/$file"
          done
          node --check site/account.js
          node --check site/account-bridge.js
          node --check site/national.js
          node --check site/company-fit-core.js
          node --check site/company-fit.js
          node --check site/app.js
          node --check site/sw.js
          node --check site/plan-policy.js
          node tests/company-fit.cjs
          node tests/freemium-policy.cjs
          node tests/pro-export.cjs
          node tests/launch-copy.cjs
          node tests/password-flow.cjs
          node tests/asaas-pro-core.mjs
          node tests/asaas-pro-integration.cjs
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("site")
          m=json.loads((p/"manifest.webmanifest").read_text())
          assert m["id"]=="./" and m["scope"]=="./" and m["start_url"].startswith("./")
          for item in m["icons"]:assert (p/item["src"]).is_file()
          html=(p/"index.html").read_text()
          assert 'href="./conta.html"' in html and 'R$ 49,90' in html
          assert "mylife-caue-app/radar/" not in html
          print("PASS independent Editalume publishing artifact")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Editalume static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
