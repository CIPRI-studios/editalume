name: Editalume · daily 27-UF freshness watch
on:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *' # 08:00 Sao Paulo, after the daily collector
  push:
    branches: [main]
    paths:
      - 'radar/health_check.py'
      - 'radar/test_health_check.py'
      - '.github/workflows/radar-health.yml'
permissions:
  contents: read
  issues: write
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline threshold tests
        run: python -m unittest radar.test_health_check -v
      - name: Verify recent data from 27 UFs
        id: check
        run: python radar/health_check.py
      - name: Maintain one GitHub issue on failure
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const title='Editalume: verificar atualização diária das 27 UFs';
            const existing=(await github.rest.issues.listForRepo({
              owner,repo,state:'open',per_page:100
            })).data.find(x=>!x.pull_request && x.title===title);
            const failed='${{ steps.check.outcome }}'!=='success';
            const url='https://github.com/'+owner+'/'+repo+'/actions/runs/'+context.runId;
            if(failed && !existing){
              await github.rest.issues.create({
                owner,repo,title,
                body:'A verificação diária falhou. Confira a coleta no GitHub e os registros no Supabase.\n\nExecução: '+url+'\n\nA cobertura e amostral.'
              });
            }else if(failed && existing){
              await github.rest.issues.createComment({
                owner,repo,issue_number:existing.number,body:'Falha novamente: '+url
              });
            }else if(!failed && existing){
              await github.rest.issues.createComment({
                owner,repo,issue_number:existing.number,body:'Amostras de 27 UFs recentes novamente: '+url
              });
              await github.rest.issues.update({owner,repo,issue_number:existing.number,state:'closed'});
            }
