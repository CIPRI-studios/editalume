name: Editalume · preflight de PR
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check site/account.js
          node --check site/account-bridge.js
          node --check site/national.js
          node --check site/company-fit-core.js
          node --check site/company-fit.js
          node --check site/app.js
          node --check site/sw.js
          node --check site/plan-policy.js
          node --check tests/launch-copy.cjs
          cp supabase/functions/editalume-pro-billing-webhook/index.ts /tmp/editalume-webhook.mjs
          cp supabase/functions/editalume-pro-billing-intent/index.ts /tmp/editalume-intent.mjs
          node --check /tmp/editalume-webhook.mjs
          node --check /tmp/editalume-intent.mjs
      - name: Regressions offline
        run: |
          node tests/company-fit.cjs
          node tests/freemium-policy.cjs
          node tests/pro-export.cjs
          node tests/launch-copy.cjs
          node tests/password-flow.cjs
          node tests/asaas-pro-core.mjs
          node tests/asaas-pro-integration.cjs
